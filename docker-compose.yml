services:
  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
      - ./scripts/orders_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  orders:
    build:
      context: .
      dockerfile: orders/Dockerfile
    depends_on:
      orders-db:
        condition: service_healthy
    ports:
      - "4445:4444"

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    ports:
      - "6433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./scripts/auth_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  products-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: products_db
    ports:
      - "7433:5432"
    volumes:
      - products_data:/var/lib/postgresql/data
      - ./scripts/products_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      - AUTH_DB_CONN_STR=postgres://auth:auth@auth-db:5432/auth_db
    ports:
      - "5556:5555"
    env_file:
      - ./auth/.env

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      - auth
      - orders
    environment:
      - AUTH_SERVICE_URL=auth:5555
      - ORDER_SERVICE_URL=orders:4444
    ports:
      - "3001:3000"
    env_file:
      - ./gateway/.env

volumes:
  orders_data:
  auth_data:
  products_data:
