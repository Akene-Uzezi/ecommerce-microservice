# --- gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: gateway
          imagePullPolicy: Never
          env:
            - { name: AUTH_SERVICE_URL, value: "auth:5555" }
            - { name: ORDER_SERVICE_URL, value: "orders:4444" }
            - { name: PRODUCTS_SERVICE_URL, value: "products:7777" }
            - { name: PAYMENTS_SERVICE_URL, value: "payments:9000" }
            - { name: STOCK_SERVICE_URL, value: "stock:8888" }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - { port: 3000, targetPort: 3000 }
