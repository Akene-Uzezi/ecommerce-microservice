# --- auth ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: auth
          imagePullPolicy: Never
          env:
            - {
                name: AUTH_DB_CONN_STR,
                value: "postgres://auth:auth@auth-db:5432/auth_db",
              }
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: { app: auth }
  ports:
    - { port: 5555, targetPort: 5555 }
---
