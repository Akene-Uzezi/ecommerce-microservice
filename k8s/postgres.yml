# --- auth-db ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-db }
  template:
    metadata:
      labels: { app: auth-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: "auth" }
            - { name: POSTGRES_PASSWORD, value: "auth" }
            - { name: POSTGRES_DB, value: "auth_db" }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init-sql, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "auth", "-d", "auth_db"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: auth-db-pvc } }
        - { name: init-sql, configMap: { name: auth-init-sql } }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  selector: { app: auth-db }
  ports:
    - { port: 5432, targetPort: 5432 }
---
