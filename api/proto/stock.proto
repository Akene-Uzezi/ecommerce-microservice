syntax = "proto3";

package stock;

option go_package = "ecommerce/api/gen/stock;stockpb";

message CheckProductInStoreRequest { string productName = 1; }

message CheckProductInStoreResponse { uint32 quantity = 1; }

service StockService {
  rpc CheckProductInStore(CheckProductInStoreRequest)
      returns (CheckProductInStoreResponse);
}
